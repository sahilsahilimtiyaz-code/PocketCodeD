name: Build PocketCodeD Android APK

on:
  push:
    branches:
      - main
      - master
      - develop
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile, Test & Package PocketCodeD APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "$SDK_DIR/licenses/intel-android-extra-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_DIR/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_DIR/licenses/google-gdk-license"
          printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$SDK_DIR/licenses/mips-android-sysimage-license"
          echo "Android SDK licenses configured in $SDK_DIR/licenses"

      - name: Normalize Gradle & AGP Versions for Public GitHub Runner
        run: |
          python3 - << 'EOF'
          import urllib.request
          from pathlib import Path

          # Check if internal AI Studio AGP 9.1.1 is published on public dl.google.com
          agp_911_url = "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.1.1/gradle-9.1.1.pom"
          is_public_agp_911 = False
          try:
              req = urllib.request.Request(agp_911_url, method="HEAD")
              with urllib.request.urlopen(req, timeout=5) as resp:
                  is_public_agp_911 = (resp.status == 200)
          except Exception:
              is_public_agp_911 = False

          if not is_public_agp_911:
              print("Normalizing gradle/libs.versions.toml and app/build.gradle.kts for public Google Maven / Maven Central...")
              toml_path = Path("gradle/libs.versions.toml")
              if toml_path.exists():
                  toml = toml_path.read_text()
                  replacements = {
                      'agp = "9.1.1"': 'agp = "8.7.3"',
                      'coreKtx = "1.18.0"': 'coreKtx = "1.15.0"',
                      'junitVersion = "1.3.0"': 'junitVersion = "1.2.1"',
                      'espressoCore = "3.7.0"': 'espressoCore = "3.6.1"',
                      'kotlin = "2.2.10"': 'kotlin = "2.1.0"',
                      'googleDevtoolsKsp = "2.3.5"': 'googleDevtoolsKsp = "2.1.0-1.0.29"',
                      'robolectric = "4.16.1"': 'robolectric = "4.14.1"',
                      'googleServices = "4.5.0"': 'googleServices = "4.4.2"',
                  }
                  for old, new in replacements.items():
                      toml = toml.replace(old, new)
                  toml_path.write_text(toml)

              app_gradle = Path("app/build.gradle.kts")
              if app_gradle.exists():
                  txt = app_gradle.read_text()
                  txt = txt.replace("compileSdk { version = release(36) { minorApiLevel = 1 } }", "compileSdk = 35")
                  txt = txt.replace("targetSdk = 36", "targetSdk = 35")
                  app_gradle.write_text(txt)

              wrapper_props = Path("gradle/wrapper/gradle-wrapper.properties")
              if wrapper_props.exists():
                  wtxt = wrapper_props.read_text()
                  wtxt = wtxt.replace("gradle-9.3.1-bin.zip", "gradle-8.11.1-bin.zip")
                  wrapper_props.write_text(wtxt)
          EOF

      - name: Setup Gradle 8.11.1 with Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare .env and Signing Keystores for CI
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PocketCodeD Release,O=PocketCodeD,C=US"
          fi

      - name: Run Unit Tests
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --no-daemon

      - name: Assemble Debug & Release APKs
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/PocketCodeD-debug.apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apks/PocketCodeD-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist-apks/PocketCodeD-release-unsigned.apk
          fi
          ls -lh dist-apks/

      - name: Upload PocketCodeD APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketCodeD-Android-APKs
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          generate_release_notes: true
